[project]
name = "lion-monitor"
version = "0.1.0"
description = "Lion-Monitor — 锂电池产线在线监测系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "streamlit>=1.36",
    "plotly>=5.20",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lion_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
